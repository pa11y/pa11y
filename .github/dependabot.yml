version: 2
updates:
  - package-ecosystem: 'npm'
    allow:
      - dependency-type: 'production'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        patterns:
          - '*'
    labels:
      - 'dependencies'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
